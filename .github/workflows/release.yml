name: Release

# Builds the macOS DMG and the Linux AppImage and .deb.
# Push a tag like v1.0.0 to build them and publish a GitHub release.
# Run it by hand from the Actions tab to build without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # Whether the Apple signing secrets have been added to the repository.
      HAS_CERT: ${{ secrets.CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            files: |
              dist/*.dmg
          - name: Linux
            os: ubuntu-latest
            files: |
              dist/*.AppImage
              dist/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Build (Linux)
        if: matrix.name == 'Linux'
        run: npm run dist:linux

      # With the signing secrets set, the app is signed with the Developer ID
      # and notarized by Apple, so it opens without any warning.
      - name: Build, sign and notarize (macOS)
        if: matrix.name == 'macOS' && env.HAS_CERT == 'true'
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Without them, sign ad-hoc: macOS then offers "Open Anyway" in Privacy
      # & Security instead of calling the app damaged.
      - name: Build with an ad-hoc signature (macOS)
        if: matrix.name == 'macOS' && env.HAS_CERT != 'true'
        run: npm run dist:mac -- -c.mac.identity=- -c.mac.hardenedRuntime=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: stip-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
