name: Release

# Builds the Tauri app (src-tauri/): a universal macOS DMG, a Linux AppImage
# and .deb, and a Windows installer, and publishes them as a GitHub release.
#
# From the Actions tab ("Run workflow"):
#   Bump the version   none, patch, minor or major. Updates package.json (the
#                      app reads its version from there) and CHANGELOG.md,
#                      and commits that to the branch the workflow ran on.
#   Publish a release  Tags the version and publishes a GitHub release with
#                      the installers and that version's changelog notes.
#                      Unticked, it only builds them.
#   macOS / Linux /    Which platforms to build. A release only carries the
#   Windows            platforms that were built.
#
# The macOS app has an ad-hoc signature, so macOS offers "Open Anyway" in
# Privacy & Security; Windows has no signature yet, so SmartScreen asks once.
#
# Pushing a tag like v1.0.0 builds every platform and publishes a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the version
        type: choice
        options: [none, patch, minor, major]
        default: none
      release:
        description: Tag this version and publish a GitHub release
        type: boolean
        default: false
      macos:
        description: Build for macOS
        type: boolean
        default: true
      linux:
        description: Build for Linux
        type: boolean
        default: true
      windows:
        description: Build for Windows
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      publish: ${{ steps.version.outputs.publish }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bump the version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/bump.js "${{ inputs.bump }}"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "true" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::v$version is already released. Run again with a bump."
              exit 1
            fi
            if ! grep -q "## \[$version\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for $version."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $version"

      # A tag push builds everything; a manual run builds the ticked platforms.
      - name: Choose platforms
        id: platforms
        shell: bash
        env:
          MACOS: ${{ github.event_name == 'push' || inputs.macos }}
          LINUX: ${{ github.event_name == 'push' || inputs.linux }}
          WINDOWS: ${{ github.event_name == 'push' || inputs.windows }}
        run: |
          matrix="$(node -e '
            const all = [
              { name: "macOS", os: "macos-latest", on: process.env.MACOS },
              { name: "Linux", os: "ubuntu-24.04", on: process.env.LINUX },
              { name: "Windows", os: "windows-latest", on: process.env.WINDOWS },
            ];
            const include = all.filter((p) => p.on === "true").map(({ on, ...p }) => p);
            if (!include.length) { console.error("Tick at least one platform."); process.exit(1); }
            console.log(JSON.stringify({ include }));
          ')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Building: $(echo "$matrix" | node -p 'JSON.parse(require("fs").readFileSync(0)).include.map((p) => p.name).join(", ")')"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: src-tauri
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The pages import their fonts from node_modules.
      - run: npm ci
        working-directory: .
      - name: Linux libraries for the webview, tray and idle time
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libx11-dev libxss-dev libdbus-1-dev pkg-config file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --locked
      # Stages the pages and fonts in ui-dist/, which the Tauri CLI looks for
      # before it builds.
      - run: cargo check --locked
      - name: Build the installers
        run: |
          case "$RUNNER_OS" in
            macOS) args=(--target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}') ;;
            Linux) args=(--bundles appimage,deb) ;;
            Windows) args=(--bundles nsis) ;;
          esac
          npx --yes @tauri-apps/cli@2.12.4 build "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: stip-${{ matrix.name }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Release notes from the changelog
        run: node scripts/release-notes.js "${{ needs.prepare.outputs.version }}" > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          pattern: stip-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Stip ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
