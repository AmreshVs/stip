name: Release

# Builds the macOS DMG, the Linux AppImage and .deb, and the Windows installer
# and Store package, and publishes them as a GitHub release.
#
# From the Actions tab ("Run workflow"):
#   Bump the version   none, patch, minor or major. Updates package.json and
#                      CHANGELOG.md and commits that to main.
#   Publish a release  Tags the version and publishes a GitHub release with
#                      the installers and that version's changelog notes.
#                      Unticked, it only builds them.
#   macOS / Linux /    Which platforms to build. A release only carries the
#   Windows            platforms that were built.
#
# Pushing a tag like v1.0.0 builds every platform and publishes a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the version
        type: choice
        options: [none, patch, minor, major]
        default: none
      release:
        description: Tag this version and publish a GitHub release
        type: boolean
        default: false
      macos:
        description: Build for macOS
        type: boolean
        default: true
      linux:
        description: Build for Linux
        type: boolean
        default: true
      windows:
        description: Build for Windows
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      publish: ${{ steps.version.outputs.publish }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump the version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/bump.js "${{ inputs.bump }}"
          git push origin HEAD:main

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "true" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::v$version is already released. Run again with a bump."
              exit 1
            fi
            if ! grep -q "## \[$version\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for $version."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $version"

      # A tag push builds everything; a manual run builds the ticked platforms.
      - name: Choose platforms
        id: platforms
        shell: bash
        env:
          MACOS: ${{ github.event_name == 'push' || inputs.macos }}
          LINUX: ${{ github.event_name == 'push' || inputs.linux }}
          WINDOWS: ${{ github.event_name == 'push' || inputs.windows }}
        run: |
          matrix="$(node -e '
            const all = [
              { name: "macOS", os: "macos-latest", files: "dist/*.dmg", on: process.env.MACOS },
              { name: "Linux", os: "ubuntu-latest", files: "dist/*.AppImage\ndist/*.deb", on: process.env.LINUX },
              { name: "Windows", os: "windows-latest", files: "dist/*.exe\ndist/*.appx", on: process.env.WINDOWS },
            ];
            const include = all.filter((p) => p.on === "true").map(({ on, ...p }) => p);
            if (!include.length) { console.error("Tick at least one platform."); process.exit(1); }
            console.log(JSON.stringify({ include }));
          ')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Building: $(echo "$matrix" | node -p 'JSON.parse(require("fs").readFileSync(0)).include.map((p) => p.name).join(", ")')"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      # Whether the Apple signing secrets have been added to the repository.
      HAS_CERT: ${{ secrets.CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build (Linux)
        if: matrix.name == 'Linux'
        run: npm run dist:linux

      # No Windows signing certificate yet, so SmartScreen asks once on
      # first run: More info, then Run anyway.
      - name: Build (Windows)
        if: matrix.name == 'Windows'
        run: npm run dist:win

      # The Microsoft Store package. Upload it in Partner Center; the Store
      # signs it, so Store installs show no warning.
      - name: Build the Store package (Windows)
        if: matrix.name == 'Windows'
        run: npm run dist:store

      # With the signing secrets set, the app is signed with the Developer ID
      # and notarized by Apple, so it opens without any warning.
      - name: Build, sign and notarize (macOS)
        if: matrix.name == 'macOS' && env.HAS_CERT == 'true'
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Without them, sign ad-hoc: macOS then offers "Open Anyway" in Privacy
      # & Security instead of calling the app damaged.
      - name: Build with an ad-hoc signature (macOS)
        if: matrix.name == 'macOS' && env.HAS_CERT != 'true'
        run: npm run dist:mac -- -c.mac.identity=- -c.mac.hardenedRuntime=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: stip-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Release notes from the changelog
        run: node scripts/release-notes.js "${{ needs.prepare.outputs.version }}" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Stip ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          # The Store package isn't attached: it only installs through the Store.
          files: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
