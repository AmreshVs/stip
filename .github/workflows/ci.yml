name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: End-to-end test (macOS)
    runs-on: macos-latest
    # A hung Electron run used to sit until GitHub's six-hour limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e

  # The Tauri port in src-tauri/: Rust unit tests and a release build on every
  # platform. npm ci fetches the fonts the pages import.
  tauri:
    name: Tauri tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Linux libraries for the webview, tray and idle time
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libx11-dev libxss-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Binary size
        shell: bash
        run: ls -l target/release/stip target/release/stip.exe 2>/dev/null || true

  # Runs the real app once on macOS: a break, the water reminder, the tray
  # panel, settings, the Spine report and the stip command, then checks each.
  tauri-probe:
    name: Tauri self-check (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo build --locked
        working-directory: src-tauri
      - name: Run the probe
        run: |
          mkdir -p "$RUNNER_TEMP/stip-data" "$RUNNER_TEMP/stip-probe"
          STIP_PROBE=1 \
          STIP_USER_DATA="$RUNNER_TEMP/stip-data" \
          STIP_SOCKET=/tmp/stip-ci.sock \
          STIP_PROBE_OUT="$RUNNER_TEMP/stip-probe/probe.json" \
          perl -e 'alarm 180; exec @ARGV' src-tauri/target/debug/stip
      - name: Keep the probe's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-probe
          path: ${{ runner.temp }}/stip-probe
          if-no-files-found: ignore
