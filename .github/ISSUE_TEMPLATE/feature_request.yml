name: Idea or feature request
description: Suggest something that would make Stip better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Tell us about the moment when you wished Stip did this.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
