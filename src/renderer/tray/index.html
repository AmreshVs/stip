<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Stip</title>
  <link rel="stylesheet" href="../shared/characters.css">
  <link rel="stylesheet" href="tray.css">
</head>
<body class="asleep">
  <main class="panel" id="panel">
    <section class="top">
      <div class="top-line"><strong id="status-text">Next break</strong><span id="break-at"></span></div>
      <div class="clock" id="next">--:--</div>
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
      <p class="note" id="note" hidden></p>
      <p class="summary" id="summary"></p>
    </section>

    <hr>
    <button class="row" data-act="stand-now">Stand now</button>
    <button class="row" id="sip" data-act="sip">
      Log a sip
      <span class="side">
        <svg class="bead" id="bead-char" viewBox="0 0 160 160" aria-hidden="true" hidden></svg>
        <svg class="bead" id="bead-orb" viewBox="0 0 40 40" aria-hidden="true">
          <defs><clipPath id="bead-clip"><circle cx="20" cy="20" r="16"/></clipPath></defs>
          <circle class="bead-glass" cx="20" cy="20" r="16"/>
          <g clip-path="url(#bead-clip)"><g id="bead-level"><path class="bead-water" d="M0 0 H40 V40 H0 Z"/></g></g>
        </svg>
        <span id="glasses"></span>
      </span>
    </button>
    <button class="row" id="water-now" data-act="water-now">Water reminder now<span class="side" id="water-next"></span></button>
    <button class="row" id="meeting" data-act="meeting-toggle" aria-pressed="false">
      Meeting mode<span class="side" id="meeting-text">Off</span>
    </button>
    <button class="row" id="pause-toggle" aria-expanded="false">Pause<span class="side chevron" aria-hidden="true">›</span></button>
    <div class="sub" id="pause-row" hidden>
      <button class="row" data-act="pause" data-min="30">For 30 minutes</button>
      <button class="row" data-act="pause" data-min="60">For 1 hour</button>
      <button class="row" data-act="pause" data-min="day">For today</button>
    </div>
    <button class="row" id="resume" data-act="resume" hidden>Resume</button>

    <hr>
    <button class="row" data-act="report-open">This week's report</button>
    <button class="row" data-act="settings">Settings…<span class="side mac-only">⌘,</span></button>
    <button class="row" data-act="quit">Quit Stip<span class="side mac-only">⌘Q</span></button>
  </main>
  <script src="../shared/format.js"></script>
  <script src="../shared/characters.js"></script>
  <script src="tray.js"></script>
</body>
</html>
