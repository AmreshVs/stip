<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Stip</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="tray.css">
</head>
<body>
  <main class="panel">
    <header class="hero">
      <div class="ring">
        <svg viewBox="0 0 92 92" aria-hidden="true">
          <circle class="ring-track" cx="46" cy="46" r="42"></circle>
          <circle class="ring-fill" id="ring" cx="46" cy="46" r="42"></circle>
        </svg>
        <div class="orb"></div>
      </div>
      <div>
        <div class="eyebrow" id="next-label">Next stand</div>
        <div class="big display" id="next">--:--</div>
        <div class="sub" id="sitting">Sitting for 0 min</div>
      </div>
    </header>

    <section class="water" id="water-row">
      <svg class="bead" viewBox="0 0 40 40" aria-hidden="true">
        <defs><clipPath id="bead-clip"><circle cx="20" cy="20" r="16"></circle></clipPath></defs>
        <circle class="bead-glass" cx="20" cy="20" r="16"></circle>
        <g clip-path="url(#bead-clip)"><rect class="bead-water" id="bead-water" x="0" y="20" width="40" height="40"></rect></g>
      </svg>
      <div class="water-text">
        <div class="water-count" id="glasses">0 of 8 glasses</div>
        <div class="water-next" id="water-next">Next sip in -- min</div>
      </div>
      <button class="sip" data-act="sip">+ Sip</button>
    </section>

    <section class="stats">
      <div class="stat"><div class="stat-num display" id="stat-breaks">0</div><div class="stat-label">Breaks today</div></div>
      <div class="stat"><div class="stat-num display" id="stat-water">0 L</div><div class="stat-label">Water</div></div>
      <div class="stat streak"><div class="stat-num display" id="stat-streak">0</div><div class="stat-label">Day streak</div></div>
    </section>

    <section class="actions">
      <button class="primary" data-act="stand-now">Stand now</button>
      <button class="secondary" id="meeting" data-act="meeting-toggle">Meeting mode</button>
    </section>

    <section class="pause">
      <div class="pause-label" id="pause-label">Pause reminders</div>
      <div class="pause-row" id="pause-row">
        <button data-act="pause" data-min="30">30 min</button>
        <button data-act="pause" data-min="60">1 hour</button>
        <button data-act="pause" data-min="day">Rest of day</button>
      </div>
      <button class="resume" id="resume" data-act="resume" hidden>Resume reminders</button>
    </section>

    <footer class="menu">
      <button data-act="settings"><span>Settings</span><kbd id="settings-key">⌘ ,</kbd></button>
      <button class="quiet" data-act="quit"><span>Quit Stip</span></button>
    </footer>
  </main>
  <script src="../shared/format.js"></script>
  <script src="tray.js"></script>
</body>
</html>
