<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Spine report</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <main class="report">
    <header class="head">
      <div class="head-text">
        <div class="mono meta" id="meta"></div>
        <h1 class="display" id="title"></h1>
      </div>
      <div class="actions no-capture">
        <button class="ghost" id="copy">Copy as image</button>
        <button class="primary" id="save">Save PNG</button>
      </div>
    </header>

    <div class="body">
      <section class="review-side">
        <div class="mono meta file">habits/this-week.diff <span class="plus" id="plus"></span> <span class="minus" id="minus"></span></div>
        <div class="mono diff" id="diff"></div>

        <div class="comment">
          <svg class="avatar" viewBox="0 0 300 500" aria-hidden="true"><path class="avatar-drop" d="M150 0C150 0 70 94 70 150a80 80 0 00160 0C230 94 150 0 150 0z"/><path class="avatar-arrow" d="M150 465 L150 315 M70 390 L150 310 L230 390"/></svg>
          <div class="bubble">
            <div class="who"><strong>stip</strong> reviewed your week</div>
            <p id="review"></p>
            <div id="suggestion-box" hidden>
              <p class="suggestion" id="suggestion"></p>
              <div class="buttons no-capture">
                <button class="primary small" id="apply">Apply suggestion</button>
                <button class="ghost small" id="dismiss">Won't fix</button>
              </div>
            </div>
            <p class="outcome" id="outcome" hidden></p>
          </div>
        </div>
      </section>

      <aside class="stats-side">
        <section>
          <h2>Breaks by hour</h2>
          <div class="bars" id="bars" role="img" aria-label="Breaks taken and skipped by hour"></div>
          <div class="mono axis" id="axis"></div>
          <div class="legend"><span><i class="taken"></i>Taken</span><span><i class="skipped"></i>Skipped</span></div>
        </section>
        <hr id="commits-rule">
        <section id="commits">
          <h2>Commits, optional</h2>
          <p class="insight" id="insight"></p>
          <p class="fine">Read from folders you choose, on this computer, and never uploaded. Off until you add one.</p>
          <ul class="folders no-capture" id="folders"></ul>
          <button class="ghost small no-capture" id="add-folder">Add a project folder</button>
        </section>
        <div class="grow"></div>
        <div class="mono brand">stip · amreshvs.github.io/stip</div>
      </aside>
    </div>
  </main>
  <script src="../shared/format.js"></script>
  <script src="report.js"></script>
</body>
</html>
