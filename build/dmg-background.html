<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stip DMG background</title>
  <!-- Rendered to background.png by scripts/build-dmg-background.js. The
       window is 540x380; Finder draws the two icons at (140, 200) and
       (400, 200), so nothing important sits under them. -->
  <link rel="stylesheet" href="../node_modules/@fontsource/bricolage-grotesque/800.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/dm-sans/500.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/dm-sans/700.css">
  <style>
    html,
    body {
      margin: 0;
      width: 540px;
      height: 380px;
      overflow: hidden;
      background: #f3f0e8;
      font-family: 'DM Sans', sans-serif;
      color: #141414;
    }

    .top {
      position: absolute;
      left: 32px;
      top: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top svg {
      width: 14px;
      height: 24px;
    }

    .word {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 30px;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .tag {
      position: absolute;
      right: 32px;
      top: 36px;
      font-size: 13px;
      font-weight: 500;
      color: #57534e;
    }

    /* Soft pads that the two icons sit on. */
    .pad {
      position: absolute;
      top: 136px;
      width: 132px;
      height: 132px;
      border-radius: 28px;
      background: #e7e3d9;
    }

    .pad.app {
      left: 74px;
    }

    .pad.apps {
      left: 334px;
    }

    .arrow {
      position: absolute;
      left: 214px;
      top: 168px;
      width: 112px;
      height: 64px;
    }

    /* Kept clear of Finder's status bar, which covers the bottom 30px. */
    .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 58px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    .hint span {
      padding: 6px 12px;
      border-radius: 999px;
      background: #c6f35c;
    }
  </style>
</head>
<body>
  <div class="top">
    <svg viewBox="0 0 300 500" aria-hidden="true"><path d="M150 0C150 0 70 94 70 150a80 80 0 00160 0C230 94 150 0 150 0z" fill="#2f5ce8"/><path d="M150 465 L150 315 M70 390 L150 310 L230 390" fill="none" stroke="#141414" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="word">stip</span>
  </div>
  <div class="tag">Stand. Sip. Ship.</div>

  <div class="pad app"></div>
  <div class="pad apps"></div>

  <svg class="arrow" viewBox="0 0 112 64" aria-hidden="true">
    <path d="M8 40 C 34 10, 70 10, 94 34" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
    <path d="M80 36 L96 36 L94 20" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <p class="hint"><span>Drag Stip into Applications</span></p>
</body>
</html>
